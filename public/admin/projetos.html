<!doctype html>
<html lang="pt" data-tema="claro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projetos — GeoTrack</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="topo" id="topo"></div>

<div class="painel">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>Projetos</h2>
    <button class="primario" onclick="window.location.href='projeto-detalhe.html'">+ Novo Projeto</button>
  </div>
  <div class="grelha" style="margin-bottom:10px;">
    <select id="filtro-cliente" onchange="carregarProjetos()"><option value="">Todos os clientes</option></select>
    <select id="filtro-estado" onchange="carregarProjetos()">
      <option value="">Todos os estados</option>
      <option value="aberto">Aberto</option>
      <option value="em_curso">Em curso</option>
      <option value="concluido">Concluído</option>
      <option value="atrasado">Atrasado</option>
      <option value="cancelado">Cancelado</option>
    </select>
    <input id="filtro-texto" placeholder="Procurar por título ou código..." oninput="carregarProjetos()">
  </div>
  <table>
    <thead><tr><th>Título</th><th>Cliente</th><th>Código</th><th>Estado</th><th>Data Abertura</th><th></th></tr></thead>
    <tbody id="tabela-projetos"></tbody>
  </table>
</div>

<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/tema.js"></script>
<script src="../js/nav.js"></script>
<script>
async function iniciar() {
  const sessao = await exigirAdmin();
  if (!sessao) return;
  renderNavAdmin('projetos.html');
  await carregarClientesFiltro();
  await carregarProjetos();
}

async function carregarClientesFiltro() {
  const { data } = await supabase.from('clientes').select('id, cliente_nome').order('cliente_nome');
  const sel = document.getElementById('filtro-cliente');
  (data || []).forEach(c => sel.innerHTML += `<option value="${c.id}">${c.cliente_nome}</option>`);
}

async function carregarProjetos() {
  let query = supabase.from('projetos').select('*, clientes(cliente_nome)').order('data_abertura', { ascending: false });
  const cliente = document.getElementById('filtro-cliente').value;
  const estado = document.getElementById('filtro-estado').value;
  const texto = document.getElementById('filtro-texto').value;
  if (cliente) query = query.eq('cliente_id', cliente);
  if (estado) query = query.eq('estado', estado);
  if (texto) query = query.or(`titulo.ilike.%${texto}%,cod_geolayer.ilike.%${texto}%`);

  const { data } = await query;
  document.getElementById('tabela-projetos').innerHTML = (data || []).map(p => `
    <tr>
      <td><a href="projeto-detalhe.html?id=${p.id}">${p.titulo}</a></td>
      <td>${p.clientes?.cliente_nome || '-'}</td>
      <td>${p.cod_geolayer || '-'}</td>
      <td><span class="tag tag-${p.estado}">${p.estado}</span></td>
      <td>${p.data_abertura || '-'}</td>
      <td><a href="projeto-detalhe.html?id=${p.id}">Abrir</a></td>
    </tr>
  `).join('');
}

iniciar();
</script>
</body>
</html>
